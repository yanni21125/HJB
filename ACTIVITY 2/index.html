```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Activity #2 Midterm - Feedback Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Feedback Form</h1>

        <h2>Activity #2 Midterm</h2>

        <p class="description">
            Hi! Please fill out the form below.
        </p>

        <form>

            <!-- Name -->
            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <!-- Address -->
            <div class="form-group">
                <label for="address">Address</label>
                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Enter your address"
                    required
                >
            </div>

            <!-- Contact Number -->
            <div class="form-group">
                <label for="contact">Contact #</label>
                <input
                    type="tel"
                    id="contact"
                    name="contact"
                    placeholder="Enter your contact number"
                    required
                >
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <!-- Message -->
            <div class="form-group">
                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="ACTIVITY #2 MIDTERM FEEDBACK FORM"
                    required
                ></textarea>
            </div>

        </form>

    </div>

</body>
</html>
```
